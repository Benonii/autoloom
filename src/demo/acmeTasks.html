<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acme Tasks</title>
<style>
  :root { --ink: #18181b; --muted: #52525b; --line: #e4e4e7; --soft: #f4f4f5; --brand: #4338ca; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: var(--ink); background: #fafafa; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 28px; background: white; border-bottom: 1px solid var(--line); }
  header strong { font-size: 18px; }
  main { max-width: 960px; margin: 0 auto; padding: 32px 24px; }
  h1 { margin: 0 0 20px; font-size: 28px; }
  button, .button { font: inherit; border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer; background: var(--soft); color: var(--ink); text-decoration: none; display: inline-block; }
  .primary { background: var(--brand); color: white; font-weight: 600; }
  .card { background: white; border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tabs [aria-selected=true] { background: var(--ink); color: white; }
  label { display: block; font-weight: 600; margin: 14px 0 6px; }
  input, select { font: inherit; width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li.row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .muted { color: var(--muted); }
  dialog { border: 0; border-radius: 16px; padding: 24px; width: min(420px, 92vw); }
  dialog::backdrop { background: rgb(0 0 0 / 0.35); }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: white; padding: 12px 20px; border-radius: 12px; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
</style>
</head>
<body>
<header><strong>Acme Tasks</strong><span id="who" class="muted"></span></header>
<main id="app"></main>
<dialog id="invite-dialog" aria-labelledby="invite-title">
  <form id="invite-form" method="dialog">
    <h2 id="invite-title" style="margin-top:0">Invite a teammate</h2>
    <label for="invite-email">Work email</label>
    <input id="invite-email" name="email" type="email" required placeholder="name@company.com">
    <label for="invite-role">Role</label>
    <select id="invite-role" name="role"><option>Editor</option><option>Viewer</option><option>Admin</option></select>
    <p style="display:flex;gap:8px;justify-content:flex-end;margin:20px 0 0">
      <button type="button" id="invite-cancel">Cancel</button>
      <button type="submit" class="primary">Send invite</button>
    </p>
  </form>
</dialog>
<script>
  const state = JSON.parse(sessionStorage.getItem('acme') || 'null') || {
    user: null,
    members: [{ email: 'ava@acme.dev', role: 'Admin' }, { email: 'leo@acme.dev', role: 'Editor' }],
    tasks: ['Write launch post', 'Record demo video', 'Ship pricing page']
  };
  const save = () => sessionStorage.setItem('acme', JSON.stringify(state));
  const app = document.getElementById('app');
  const escape = (text) => text.replace(/[&<>"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[character]);
  function toast(message) {
    const element = document.createElement('div');
    element.className = 'toast'; element.setAttribute('role', 'status'); element.textContent = message;
    document.body.appendChild(element); setTimeout(() => element.remove(), 3500);
  }
  function render() {
    const route = location.hash.slice(1) || 'projects';
    document.getElementById('who').textContent = state.user ? state.user : '';
    if (!state.user) return renderSignIn();
    if (route.startsWith('project/')) return renderProject(route.split('/')[1] || 'tasks');
    renderProjects();
  }
  function renderSignIn() {
    app.innerHTML = `<div class="card" style="max-width:400px;margin:40px auto">
      <h1>Sign in</h1>
      <form id="sign-in">
        <label for="email">Email</label><input id="email" type="email" required autocomplete="username">
        <label for="password">Password</label><input id="password" type="password" required autocomplete="current-password">
        <p id="sign-in-error" class="muted" role="alert"></p>
        <button class="primary" type="submit" style="width:100%">Sign in</button>
      </form></div>`;
    document.getElementById('sign-in').onsubmit = (event) => {
      event.preventDefault();
      const email = document.getElementById('email').value;
      if (document.getElementById('password').value !== 'launchday') {
        document.getElementById('sign-in-error').textContent = 'Wrong email or password';
        return;
      }
      state.user = email; save(); location.hash = 'projects'; render();
    };
  }
  function renderProjects() {
    app.innerHTML = `<h1>Your projects</h1><div class="grid">
      <a class="card button" href="#project/tasks"><strong>Launch</strong><br><span class="muted">${state.tasks.length} tasks, ${state.members.length} members</span></a>
      <div class="card"><strong>Website refresh</strong><br><span class="muted">Archived</span></div></div>`;
  }
  function renderProject(tab) {
    const tabs = ['tasks', 'members'].map((name) => `<a class="button" role="tab" aria-selected="${name === tab}" href="#project/${name}">${name[0].toUpperCase() + name.slice(1)}</a>`).join('');
    const body = tab === 'members'
      ? `<div class="bar"><h2 style="margin:0">Members</h2><button class="primary" id="invite-open">Invite teammate</button></div>
         <ul>${state.members.map((member) => `<li class="row"><span>${escape(member.email)}</span><span class="muted">${member.role}</span></li>`).join('')}</ul>`
      : `<div class="bar"><h2 style="margin:0">Tasks</h2><form id="task-form" style="display:flex;gap:8px"><input id="task-name" aria-label="New task" placeholder="New task"><button class="primary" type="submit">Add task</button></form></div>
         <ul>${state.tasks.map((task) => `<li class="row"><span>${escape(task)}</span></li>`).join('')}</ul>`;
    app.innerHTML = `<p><a href="#projects" class="muted">Projects</a> / Launch</p><h1>Launch</h1><div class="tabs" role="tablist">${tabs}</div><div class="card">${body}</div>`;
    const open = document.getElementById('invite-open');
    if (open) open.onclick = () => document.getElementById('invite-dialog').showModal();
    const taskForm = document.getElementById('task-form');
    if (taskForm) taskForm.onsubmit = (event) => {
      event.preventDefault();
      const name = document.getElementById('task-name').value.trim();
      if (!name) return;
      state.tasks.push(name); save(); render(); toast('Task added');
    };
  }
  document.getElementById('invite-cancel').onclick = () => document.getElementById('invite-dialog').close();
  document.getElementById('invite-form').onsubmit = (event) => {
    const email = document.getElementById('invite-email').value;
    const role = document.getElementById('invite-role').value;
    state.members.push({ email, role }); save();
    document.getElementById('invite-form').reset();
    render(); toast(`Invite sent to ${email}`);
  };
  window.addEventListener('hashchange', render);
  render();
</script>
</body>
</html>
